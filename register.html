<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - AI Smart Farming Assistant</title>
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: linear-gradient(
                rgba(0, 80, 30, 0.6),
                rgba(0, 80, 30, 0.6)
            ),
            url("/static/images/farms.jpg");
            background-size: cover;
            background-position: center;
        }
        .signup-box {
            width: 400px;
            padding: 35px;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
        }
        .signup-box h2 {
            text-align: center;
            color: #198754;
            font-weight: bold;
            margin-bottom: 8px;
        }
        .signup-box p {
            text-align: center;
            color: #666;
            margin-bottom: 25px;
        }
        .form-label {
            font-weight: 600;
        }
        .btn-signup {
            width: 100%;
            background: #198754;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: bold;
        }
        .btn-signup:hover {
            background: #146c43;
        }
        .login-text {
            text-align: center;
            margin-top: 20px;
        }
        .login-text a {
            color: #198754;
            font-weight: bold;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="signup-box">
        <h2> Create Account</h2>
        <p>Join AI Smart Farming Assistant</p>
        <form method="POST" action="/register">
            <div class="mb-3">
                <label class="form-label">Full Name</label>
                <input
                    type="text"
                    name="name"
                    class="form-control"
                    placeholder="Enter your full name"
                    required
                >
            </div>
            <div class="mb-3">
                <label class="form-label">Email</label>
                <input 
                type="email" 
                name="email" 
                class="form-control" 
                placeholder="Enter your email" 
                required>
            </div>
            <div class="mb-3">
                <label class="form-label">Mobile Number</label>
                <input type="tel" 
                name="mobile" 
                class="form-control" 
                placeholder="Enter your mobile number"
                required>
            </div>
            <div class="mb-3">
                <label class="form-label">Address</label>
                <input 
                type="text" 
                name="address" 
                class="form-control" 
                placeholder="Enter your address" 
                required>
            </div>
            <div class="mb-3">
                <label class="form-label">Password</label>
                <input
                    type="password"
                    name="password"
                    class="form-control"
                    placeholder="Create a password"
                    required
                >
            </div>
            <div class="mb-3">
                <label class="form-label">Confirm Password</label>
                <input
                    type="password"
                    name="confirm_password"
                    class="form-control"
                    placeholder="Confirm your password"
                    required
                >
            </div>
            <button type="submit" class="btn-signup">
                Sign Up
            </button>
        </form>
        <div class="login-text">
            Already have an account?
            <a href="/login">Login</a>
        </div>
    </div>
</body>
</html>
