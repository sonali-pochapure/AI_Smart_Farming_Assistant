<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Profile - AI Smart Farming Assistant</title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

    <style>

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;

            background:
                linear-gradient(
                    rgba(255,255,255,0.35),
                    rgba(255,255,255,0.35)
                ),
                url("/static/images/farm.jpg");

            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }

        .navbar {
            background: linear-gradient(
                90deg,
                #dff5e1,
                #fff7c7
            );
        }

        .navbar-brand {
            font-weight: bold;
            color: #198754 !important;
            font-size: 24px;
        }

        .main-container {
            padding: 50px 20px;
        }

        .page-title {
            text-align: center;
            color: #146c43;
            font-weight: bold;
            margin-bottom: 30px;
        }

        .profile-card {
            max-width: 700px;
            margin: auto;
            background: rgba(255,255,255,0.95);
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.2);
        }

        .profile-icon {
            text-align: center;
            font-size: 75px;
            margin-bottom: 15px;
        }

        .profile-item {
            padding: 15px;
            border-bottom: 1px solid #ddd;
            font-size: 18px;
        }

        .profile-label {
            font-weight: bold;
            color: #198754;
        }

        .language-buttons {
            text-align: center;
            margin-bottom: 25px;
        }

        footer {
            margin-top: 50px;
            background: rgba(0,0,0,0.75);
            color: white;
            text-align: center;
            padding: 20px;
        }

    </style>
</head>


<body>


<!-- NAVBAR -->

<nav class="navbar navbar-expand-lg">

    <div class="container">

        <a class="navbar-brand" href="/dashboard">
            🌾 AI Smart Farming Assistant
        </a>

        <div>

            <a href="/dashboard"
               class="btn btn-outline-success me-2"
               id="dashboardBtn">
                Dashboard
            </a>

            <button
                class="btn btn-success me-1"
                onclick="setLanguage('English')">
                English
            </button>

            <button
                class="btn btn-warning"
                onclick="setLanguage('Marathi')">
                मराठी
            </button>

        </div>

    </div>

</nav>


<!-- MAIN -->

<div class="container main-container">


    <h1 class="page-title" id="pageTitle">
        👤 My Profile
    </h1>


    <div class="language-buttons">
        <!-- Language buttons already in navbar -->
    </div>


    <div class="profile-card">


        <div class="profile-icon">
            👨‍🌾
        </div>


        <div class="profile-item">

            <span class="profile-label"
                  id="nameLabel">
                Name:
            </span>

            <span id="userName">{{ user.name }}</span>
        </div>


        <div class="profile-item">

            <span class="profile-label"
                  id="emailLabel">
                Email:
            </span>

            <span id="userEmail">{{ user.email }}</span>

        </div>


        <div class="profile-item">

            <span class="profile-label"
                  id="mobileLabel">
                Mobile:
            </span>

           <span id="userMobile">{{ user.mobile or "Not available" }}</span>

        </div>


        <div class="profile-item">

            <span class="profile-label"
                  id="locationLabel">
                Location:
            </span>

            <span id="userLocation">{{ user.Address or "Not available" }}</span>

        </div>


        <div class="profile-item">

            <span class="profile-label"
                  id="accountLabel">
                Account:
            </span>

            <span id="accountStatus">{{ user.account }}</span>

        </div>


    </div>

</div>


<!-- FOOTER -->

<footer>

    <div id="contactTitle">
        📞 Contact Us
    </div>

    <div>
        +91 9876543210
    </div>

    <div class="mt-2">
        AI Smart Farming Assistant
    </div>

</footer>


<script>

const text = {

    English: {

        title: "👤 My Profile",
        dashboard: "Dashboard",

        name: "Name:",
        email: "Email:",
        mobile: "Mobile:",
        location: "Location:",
        account: "Account:",

        active: "Active",

        contact: "📞 Contact Us"

    },

    Marathi: {

        title: "👤 माझे प्रोफाइल",
        dashboard: "डॅशबोर्ड",

        name: "नाव:",
        email: "ई-मेल:",
        mobile: "मोबाईल:",
        location: "ठिकाण:",
        account: "खाते:",

        active: "सक्रिय",

        contact: "📞 संपर्क करा"

    }

};


function setLanguage(language) {

    localStorage.setItem(
        "profileLanguage",
        language
    );

    const t = text[language];


    document.getElementById("pageTitle").innerText =
        t.title;

    document.getElementById("dashboardBtn").innerText =
        t.dashboard;

    document.getElementById("nameLabel").innerText =
        t.name;

    document.getElementById("emailLabel").innerText =
        t.email;

    document.getElementById("mobileLabel").innerText =
        t.mobile;

    document.getElementById("locationLabel").innerText =
        t.location;

    document.getElementById("accountLabel").innerText =
        t.account;

    document.getElementById("accountStatus").innerText =
        t.active;

    document.getElementById("contactTitle").innerText =
        t.contact;

}


const savedLanguage =
    localStorage.getItem("profileLanguage")
    || "English";

setLanguage(savedLanguage);

</script>


</body>
</html>
